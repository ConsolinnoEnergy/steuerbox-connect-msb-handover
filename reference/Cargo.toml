[workspace]
resolver = "2"
members = [
    "msb-core",
    "msb",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
axum = "0.8"
tower = "0.5"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "rustls-tls-webpki-roots", "json"] }
