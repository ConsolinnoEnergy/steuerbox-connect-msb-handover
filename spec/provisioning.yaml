openapi: 3.1.0
info:
  title: steuerbox-connect — Provisioning API (MSB)
  version: 0.4.0
  description: >
    NORMATIVE. Idempotent on (serial, ship_id). Writes ONLY on the canonical serial
    returned by discovery (a client-derived serial → 400 not_canonical).
    box_evidence mismatch → 422 box_mismatch + operator alarm — never a silent ignore.
    Evidence supplied for a serial without an inventory entry is unverifiable: it is
    accepted, but the server MUST raise an operator alarm (accepting silently is a
    violation). Partial evidence (only ship_id or only ski) against a known inventory
    entry counts as mismatch.
    Kill switch: provisioning for a killed (or not-in-portfolio) serial returns
    404 not_found; the response MUST NOT leak whether the serial ever existed.
    Rate limits are contract: 429 + Retry-After; clients MUST honor Retry-After and
    MUST NOT retry with a fabricated delay when the header is missing.
paths:
  /v1/serials/{serial}/provisioning:
    post:
      operationId: provisionHemsEndpoint
      parameters:
        - name: serial
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9]{4,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisioningRequest" }
            examples:
              provisioningRequest:
                externalValue: "./examples/provisioning-request.json"
      responses:
        "202":
          description: >
            Accepted — for both the first write (Created) and the idempotent replay
            of the same (serial, ship_id). The closed loop (accepted SHIP handshake
            in the LAN) proves the write reached the physical box.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedResult" }
              examples:
                accepted:
                  value:
                    status: accepted
        "400":
          description: >
            The path serial is not the canonical serial from discovery.
            Body: ErrorResponse with code `not_canonical`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                notCanonical:
                  value:
                    error: not_canonical
                    message: provisioning requires the canonical serial from discovery
        "404":
          description: >
            Serial not in portfolio or killed (kill switch). Body: ErrorResponse
            with code `not_found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                notFound:
                  value:
                    error: not_found
                    message: serial not in portfolio
        "409":
          description: >
            Write-once violation: the serial is already paired to a different
            ship_id (serial↔MSB never changes; MSB switch = physical box swap).
            Body: ErrorResponse with code `write_once_conflict`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                writeOnceConflict:
                  value:
                    error: write_once_conflict
                    message: serial is already paired to a different ship_id
        "422":
          description: >
            Either `box_mismatch` (supplied box_evidence does not match inventory;
            partial evidence counts as a mismatch) or `invalid_pairing_dataset`
            (pairing_dataset incomplete/invalid — e.g. qr_info outside the
            SHIP-Info-Datensatz shape `SHIP;…ENDSHIP;`) or `fleet_mismatch` (the
            IANA PEN inside pairing_dataset.ship_id does not match the IANA PEN
            published in the manufacturer's well-known document — fleet binding,
            ADR-0018) or `invalid_body` (request body is not a valid provisioning
            request).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                boxMismatch:
                  value:
                    error: box_mismatch
                    message: observed box evidence does not match inventory
                invalidPairingDataset:
                  value:
                    error: invalid_pairing_dataset
                    message: pairing_dataset incomplete or invalid
                fleetMismatch:
                  value:
                    error: fleet_mismatch
                    message: ship_id belongs to a different manufacturer fleet
                invalidBody:
                  value:
                    error: invalid_body
                    message: request body is not a valid provisioning request
        "429":
          description: >
            Rate limited. The Retry-After header is mandatory (seconds, numeric).
            Body: ErrorResponse with code `rate_limited`.
          headers:
            Retry-After:
              required: true
              schema: { type: integer, minimum: 1 }
              description: Seconds the client MUST wait before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                rateLimited:
                  value:
                    error: rate_limited
                    message: quota exceeded; honor Retry-After
      security:
        - mtls: []
components:
  securitySchemes:
    mtls: { type: mutualTLS }
  schemas:
    ProvisioningRequest:
      type: object
      required: [pairing_dataset]
      properties:
        pairing_dataset: { $ref: "./pairing_dataset.schema.json" }
        box_evidence:
          type: object
          description: >
            In-LAN observed Steuerbox ship_id + ski (client SHOULD send; server MUST
            accept without it). Server SHOULD verify against inventory: mismatch →
            422 box_mismatch + operator alarm; supplied but unverifiable (no
            inventory entry) → accepted with operator alarm — never a silent ignore.
            Partial evidence (only one of ship_id/ski) counts as mismatch.
          properties:
            ship_id: { type: string }
            ski: { type: string }
    AcceptedResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - box_mismatch        # 422 — evidence does not match inventory
            - invalid_pairing_dataset # 422 — pairing_dataset incomplete/invalid
            - fleet_mismatch      # 422 — ship_id PEN ≠ well-known iana_pen (ADR-0018)
            - invalid_body        # 422 — body is not a valid provisioning request
            - not_canonical       # 400 — path serial is not the canonical serial
            - not_found           # 404 — serial not in portfolio / killed
            - rate_limited        # 429 — quota exceeded; honor Retry-After
            - write_once_conflict # 409 — already paired to a different ship_id
          description: Machine-readable error code; status mapping in the enum comments.
        message: { type: string }
